{% extends "base.html" %}

{% block content %}
  <div class="p-4 rounded shadow-sm border" style="border-color: #0d3b66;">
    <h2 class="mb-4" style="color: #0d3b66; font-weight: 600;">Grocery List</h2>

    {% if ingredients %}
      <ul class="list-group mb-4">
        {% for item in ingredients %}
          <li class="list-group-item">{{ item }}</li>
        {% endfor %}
      </ul>
    {% else %}
      <p class="fst-italic text-muted">Your grocery list is empty.</p>
    {% endif %}

    <a href="{{ url_for('mealplan_daily') }}" class="btn btn-teal px-4 py-2 shadow-sm rounded">
      ← Back to Meal Plan
    </a>
  </div>

  <style>
    .btn-teal {
      background-color: #0d3b66;
      color: #f0f4f8;
      border: none;
      transition: background-color 0.3s ease;
    }
    .btn-teal:hover {
      background-color: #376fa3;
      color: white;
    }
  </style>
{% endblock %}
